/* ==========================================================
   Tooltip für "🔒 Vertraulich"
   Wird bewusst als eigenes Element am <body> angezeigt,
   damit Tabulator/Scrollbereiche es nicht abschneiden.
   ========================================================== */

.owner-private {
    cursor: help;
}

.owner-tooltip {
    position: fixed;
    z-index: 2147483647;

    width: 280px;
    max-width: calc(100vw - 30px);
    box-sizing: border-box;

    padding: 12px 14px;
    background: #333;
    color: #fff;

    border-radius: 7px;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.30);

    font-size: 13px;
    line-height: 1.45;
    text-align: left;

    pointer-events: none;
    opacity: 0;
    visibility: hidden;

    transition: opacity 0.15s ease;
}

.owner-tooltip.show {
    opacity: 1;
    visibility: visible;
}

.owner-tooltip strong {
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
}

.owner-tooltip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);

    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid #333;
}

.owner-tooltip.below::after {
    top: -6px;
    bottom: auto;

    border-top: none;
    border-bottom: 6px solid #333;
}

<!-- ==========================================================
     TOOLTIP FÜR VERTRAULICHE EIGENTÜMERANGABEN
========================================================== -->

<script>

(function () {


    let tooltip = null;

    let hideTimer = null;


    function createTooltip() {


        if (tooltip) return tooltip;


        tooltip =
            document.createElement("div");


        tooltip.className =
            "owner-tooltip";


        tooltip.innerHTML =

            "<strong>Vertrauliche Angabe</strong>" +

            "Der Name des Eigentümers ist uns bekannt, wird aus " +

            "Gründen des Datenschutzes jedoch nicht öffentlich angezeigt.";


        document.body.appendChild(tooltip);


        return tooltip;

    }


    function positionTooltip(target) {


        const tip =
            createTooltip();


        const rect =
            target.getBoundingClientRect();


        tip.classList.remove("below");


        tip.style.left =
            "0px";


        tip.style.top =
            "0px";


        tip.classList.add("show");


        const tipRect =
            tip.getBoundingClientRect();


        const gap =
            9;


        /* ------------------------------------------------------
           Standard:
           Hinweis oberhalb des Feldes
           ------------------------------------------------------ */

        let left =

            rect.left +

            (rect.width / 2) -

            (tipRect.width / 2);


        let top =

            rect.top -

            tipRect.height -

            gap;


        /* ------------------------------------------------------
           Bildschirm links/rechts
           ------------------------------------------------------ */

        const margin =
            10;


        left =
            Math.max(

                margin,

                Math.min(

                    left,

                    window.innerWidth -

                    tipRect.width -

                    margin

                )

            );


        /* ------------------------------------------------------
           Wenn oben kein Platz ist:
           unterhalb anzeigen
           ------------------------------------------------------ */

        if (top < margin) {


            top =
                rect.bottom +

                gap;


            tip.classList.add("below");

        }


        /* ------------------------------------------------------
           Auch unten im Bildschirm halten
           ------------------------------------------------------ */

        if (

            top +

            tipRect.height >

            window.innerHeight -

            margin

        ) {


            top =

                Math.max(

                    margin,

                    window.innerHeight -

                    tipRect.height -

                    margin

                );

        }


        tip.style.left =

            Math.round(left) +

            "px";


        tip.style.top =

            Math.round(top) +

            "px";

    }


    function showTooltip(target) {


        clearTimeout(hideTimer);


        positionTooltip(target);

    }


    function hideTooltip() {


        clearTimeout(hideTimer);


        hideTimer =

            setTimeout(

                function () {


                    if (tooltip) {

                        tooltip.classList.remove(
                            "show"
                        );

                    }

                },

                80

            );

    }


    /* ======================================================
       Event-Delegation

       Funktioniert auch für dynamisch erzeugte
       Tabulator-Zeilen.
       ====================================================== */


    document.addEventListener(

        "mouseover",

        function (event) {


            const target =

                event.target.closest(
                    ".owner-private"
                );


            if (!target) return;


            showTooltip(target);

        }

    );


    document.addEventListener(

        "mouseout",

        function (event) {


            const target =

                event.target.closest(
                    ".owner-private"
                );


            if (!target) return;


            if (

                event.relatedTarget &&

                target.contains(
                    event.relatedTarget
                )

            ) {

                return;

            }


            hideTooltip();

        }

    );


    /* ======================================================
       Bei Scrollen / Fensteränderung ausblenden
       ====================================================== */

    window.addEventListener(

        "scroll",

        hideTooltip,

        true

    );


    window.addEventListener(

        "resize",

        hideTooltip

    );


})();

</script>


<!-- ==========================================================
     MOBILE NAVIGATION
========================================================== -->

<script>

(function () {


    const header =
        document.querySelector("header");


    const toggle =
        document.getElementById(
            "mobileMenuToggle"
        );


    const nav =
        document.getElementById(
            "mainNavigation"
        );


    if (!header || !toggle || !nav) {

        return;

    }


    function closeMenu() {


        header.classList.remove(
            "nav-open"
        );


        toggle.setAttribute(
            "aria-expanded",
            "false"
        );


        toggle.setAttribute(
            "aria-label",
            "Menü öffnen"
        );

    }


    toggle.addEventListener(

        "click",

        function () {


            const open =

                header.classList.toggle(
                    "nav-open"
                );


            toggle.setAttribute(

                "aria-expanded",

                open
                    ? "true"
                    : "false"

            );


            toggle.setAttribute(

                "aria-label",

                open
                    ? "Menü schließen"
                    : "Menü öffnen"

            );

        }

    );


    nav.querySelectorAll("a").forEach(

        function (link) {


            link.addEventListener(

                "click",

                closeMenu

            );

        }

    );


    document.addEventListener(

        "click",

        function (event) {


            if (
                !header.contains(
                    event.target
                )
            ) {

                closeMenu();

            }

        }

    );


    window.addEventListener(

        "resize",

        function () {


            if (
                window.innerWidth > 700
            ) {

                closeMenu();

            }

        }

    );


})();

</script>
