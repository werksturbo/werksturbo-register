/* ==========================================================
   Tooltip für "🔒 Vertraulich"
   Wird bewusst als eigenes Element am <body> angezeigt,
   damit Tabulator/Scrollbereiche es nicht abschneiden.
   ========================================================== */

.owner-private {
    cursor: help;
}

.owner-tooltip {
    position: fixed;
    z-index: 2147483647;

    width: 280px;
    max-width: calc(100vw - 30px);
    box-sizing: border-box;

    padding: 12px 14px;
    background: #333;
    color: #fff;

    border-radius: 7px;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.30);

    font-size: 13px;
    line-height: 1.45;
    text-align: left;

    pointer-events: none;
    opacity: 0;
    visibility: hidden;

    transition: opacity 0.15s ease;
}

.owner-tooltip.show {
    opacity: 1;
    visibility: visible;
}

.owner-tooltip strong {
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
}

.owner-tooltip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);

    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid #333;
}

.owner-tooltip.below::after {
    top: -6px;
    bottom: auto;

    border-top: none;
    border-bottom: 6px solid #333;
}


/* ==========================================================
   Mobile-Navigation / Smartphone-Optimierung
   Die Desktop-Navigation bleibt unverändert.
   ========================================================== */

}

    /* Hamburger ist auf dem Smartphone immer sichtbar */

    /* Die bisherige große mobile Navigation wird zunächst komplett versteckt. */

        width: auto !important;
        height: auto !important;
        max-height: calc(100vh - 90px) !important;
        overflow-y: auto !important;
        margin: 0 !important;
        padding: 6px 0 !important;
        border-radius: 0 0 10px 10px !important;
        box-sizing: border-box !important;
        background: #0b4f78 !important;

        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        list-style: none !important;
        gap: 0 !important;
    }

    header nav li {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
    }

<script>
/* ==========================================================
   Tooltip für vertrauliche Eigentümerangaben
   ========================================================== */

(function () {

    let tooltip = null;
    let hideTimer = null;

    function createTooltip() {

        if (tooltip) return tooltip;

        tooltip = document.createElement("div");

        tooltip.className = "owner-tooltip";

        tooltip.innerHTML =
            "<strong>Vertrauliche Angabe</strong>" +
            "Der Name des Eigentümers ist uns bekannt, wird aus " +
            "Gründen des Datenschutzes jedoch nicht öffentlich angezeigt.";

        document.body.appendChild(tooltip);

        return tooltip;
    }


    function positionTooltip(target) {

        const tip = createTooltip();

        const rect = target.getBoundingClientRect();

        tip.classList.remove("below");

        tip.style.left = "0px";
        tip.style.top = "0px";


        // Erst sichtbar machen,
        // damit die tatsächliche Größe bekannt ist.

        tip.classList.add("show");


        const tipRect = tip.getBoundingClientRect();

        const gap = 9;


        // ------------------------------------------------------
        // Standard:
        // Hinweis oberhalb des Feldes
        // ------------------------------------------------------

        let left =
            rect.left +
            (rect.width / 2) -
            (tipRect.width / 2);

        let top =
            rect.top -
            tipRect.height -
            gap;


        // ------------------------------------------------------
        // Nicht aus dem linken/rechten Bildschirm laufen
        // ------------------------------------------------------

        const margin = 10;

        left = Math.max(
            margin,
            Math.min(
                left,
                window.innerWidth -
                tipRect.width -
                margin
            )
        );


        // ------------------------------------------------------
        // Wenn oberhalb nicht genügend Platz vorhanden ist:
        // unterhalb anzeigen
        // ------------------------------------------------------

        if (top < margin) {

            top = rect.bottom + gap;

            tip.classList.add("below");
        }


        // ------------------------------------------------------
        // Auch unten innerhalb des sichtbaren Bereichs halten
        // ------------------------------------------------------

        if (
            top + tipRect.height >
            window.innerHeight - margin
        ) {

            top =
                Math.max(
                    margin,
                    window.innerHeight -
                    tipRect.height -
                    margin
                );
        }


        tip.style.left =
            Math.round(left) + "px";

        tip.style.top =
            Math.round(top) + "px";
    }


    function showTooltip(target) {

        clearTimeout(hideTimer);

        positionTooltip(target);
    }


    function hideTooltip() {

        clearTimeout(hideTimer);

        hideTimer = setTimeout(function () {

            if (tooltip) {

                tooltip.classList.remove("show");

            }

        }, 80);
    }


    // ==========================================================
    // Event-Delegation
    //
    // Funktioniert auch für die dynamisch von Tabulator
    // erzeugten Tabellenzeilen.
    // ==========================================================

    document.addEventListener(
        "mouseover",
        function (event) {

            const target =
                event.target.closest(".owner-private");

            if (!target) return;

            showTooltip(target);

        }
    );


    document.addEventListener(
        "mouseout",
        function (event) {

            const target =
                event.target.closest(".owner-private");

            if (!target) return;


            // Nur ausblenden, wenn die Maus
            // das Feld tatsächlich verlässt.

            if (
                event.relatedTarget &&
                target.contains(event.relatedTarget)
            ) {
                return;
            }

            hideTooltip();

        }
    );


    // ==========================================================
    // Bei Scrollen oder Fenstergrößenänderung ausblenden
    // ==========================================================

    window.addEventListener(
        "scroll",
        hideTooltip,
        true
    );

    window.addEventListener(
        "resize",
        hideTooltip
    );

})();
</script>



<script>
/* ==========================================================
   Kompakte mobile Navigation
   ========================================================== */
(function () {
    const header = document.querySelector("header");
    const toggle = document.getElementById("mobileMenuToggle");
    const nav = document.getElementById("mainNavigation");

    if (!header || !toggle || !nav) return;

    function closeMenu() {
        header.classList.remove("nav-open");
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Menü öffnen");
    }

    toggle.addEventListener("click", function () {
        const open = header.classList.toggle("nav-open");
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "Menü schließen" : "Menü öffnen");
    });

    nav.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", closeMenu);
    });

    document.addEventListener("click", function (event) {
        if (!header.contains(event.target)) closeMenu();
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 700) closeMenu();
    });
})();
</script>
